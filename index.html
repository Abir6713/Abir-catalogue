<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abir Publishing</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
background: #f7f7f7;
color: #222;
}

header {
background: #111;
color: white;
text-align: center;
padding: 50px 20px;
}

header h1 {
font-size: 36px;
margin-bottom: 10px;
}

header p {
font-size: 17px;
color: #ccc;
}

.container {
max-width: 900px;
margin: 0 auto;
padding: 40px 20px;
}

.section-title {
text-align: center;
margin-bottom: 25px;
}

.services {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 20px;
}

.service {
background: white;
padding: 25px;
border-radius: 12px;
text-align: center;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.service h3 {
margin-bottom: 15px;
font-size: 20px;
}

.price {
font-size: 24px;
font-weight: bold;
color: #111;
}

footer {
text-align: center;
padding: 30px 20px;
margin-top: 30px;
background: #111;
color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>Abir Publishing</h1>
<p>Publishing and Editorial Services</p>
</header>

<main class="container">

<h2 class="section-title">Our Services</h2>

<div class="services">

<div class="service">
<h3>Code Writing</h3>
<p class="price">₦100,000</p>
</div>

<div class="service">
<h3>Editing</h3>
<p class="price">₦100,000</p>
</div>

<div class="service">
<h3>Proofreading</h3>
<p class="price">₦200,000</p>
</div>

</div>

</main>

<footer>
<p>© 2026 Abir Publishing. All rights reserved.</p>
</footer>

</body>
</html>
